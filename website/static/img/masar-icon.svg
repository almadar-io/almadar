<?xml version="1.0" encoding="UTF-8"?>
<!-- F Orbital: 6 lobes (3 pairs at 60° spacing) -->
<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="masarGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="50%" stop-color="#b45309" />
            <stop offset="100%" stop-color="#92400e" />
        </linearGradient>
    </defs>
    <!-- Pair 1: 0° (vertical) -->
    <ellipse cx="50" cy="28" rx="12" ry="18" fill="none" stroke="url(#masarGrad)" stroke-width="2.5" />
    <ellipse cx="50" cy="72" rx="12" ry="18" fill="none" stroke="url(#masarGrad)" stroke-width="2.5" />
    <ellipse cx="50" cy="32" rx="7" ry="11" fill="none" stroke="url(#masarGrad)" stroke-width="1.5" opacity="0.5" />
    <ellipse cx="50" cy="68" rx="7" ry="11" fill="none" stroke="url(#masarGrad)" stroke-width="1.5" opacity="0.5" />
    <!-- Pair 2: 60° -->
    <g transform="rotate(60 50 50)">
        <ellipse cx="50" cy="28" rx="12" ry="18" fill="none" stroke="url(#masarGrad)" stroke-width="2.5" />
        <ellipse cx="50" cy="72" rx="12" ry="18" fill="none" stroke="url(#masarGrad)" stroke-width="2.5" />
        <ellipse cx="50" cy="32" rx="7" ry="11" fill="none" stroke="url(#masarGrad)" stroke-width="1.5" opacity="0.5" />
        <ellipse cx="50" cy="68" rx="7" ry="11" fill="none" stroke="url(#masarGrad)" stroke-width="1.5" opacity="0.5" />
    </g>
    <!-- Pair 3: 120° -->
    <g transform="rotate(120 50 50)">
        <ellipse cx="50" cy="28" rx="12" ry="18" fill="none" stroke="url(#masarGrad)" stroke-width="2.5" />
        <ellipse cx="50" cy="72" rx="12" ry="18" fill="none" stroke="url(#masarGrad)" stroke-width="2.5" />
        <ellipse cx="50" cy="32" rx="7" ry="11" fill="none" stroke="url(#masarGrad)" stroke-width="1.5" opacity="0.5" />
        <ellipse cx="50" cy="68" rx="7" ry="11" fill="none" stroke="url(#masarGrad)" stroke-width="1.5" opacity="0.5" />
    </g>
    <!-- Center nucleus -->
    <circle cx="50" cy="50" r="3.5" fill="url(#masarGrad)" />
</svg>
