<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <g transform="translate(400,300)">
      <!-- Central Geometric Ordering -->
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="#14b8a6" stroke-width="3" opacity="0.8"/>
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" transform="rotate(30)"/>
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#14b8a6" opacity="0.2" stroke="#14b8a6" stroke-width="1"/>
      <circle cx="0" cy="0" r="15" fill="#06b6d4" filter="url(#glow)"/>
      
      <!-- Lines projecting outward -->
      <line x1="0" y1="-120" x2="0" y2="-200" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
      <line x1="104" y1="-60" x2="160" y2="-100" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
      <line x1="104" y1="60" x2="160" y2="100" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
      <line x1="0" y1="120" x2="0" y2="200" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
      <line x1="-104" y1="60" x2="-160" y2="100" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
      <line x1="-104" y1="-60" x2="-160" y2="-100" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
    </g>
  
</svg>