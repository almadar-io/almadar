<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <!-- Neural Cloud Left -->
    <g transform="translate(200, 300)">
      <circle cx="0" cy="0" r="120" fill="#f1f5f9" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1" opacity="0.5"/>
      <circle cx="-40" cy="-30" r="10" fill="#06b6d4" filter="url(#glow)"/>
      <circle cx="20" cy="-50" r="8" fill="#14b8a6"/>
      <circle cx="-10" cy="40" r="12" fill="#06b6d4"/>
      <circle cx="50" cy="20" r="6" fill="#14b8a6"/>
      <line x1="-40" y1="-30" x2="20" y2="-50" stroke="#14b8a6" stroke-width="1" opacity="0.6"/>
      <line x1="-40" y1="-30" x2="-10" y2="40" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>
      <line x1="-10" y1="40" x2="50" y2="20" stroke="#14b8a6" stroke-width="1"/>
      <line x1="20" y1="-50" x2="50" y2="20" stroke="#06b6d4" stroke-width="1"/>
    </g>
    
    <!-- Transition Pipeline -->
    <path d="M300 300 C400 300, 400 300, 500 300" fill="none" stroke="#14b8a6" stroke-width="4" stroke-dasharray="10 5" filter="url(#glow)"/>
    <polygon points="460,290 480,300 460,310" fill="#06b6d4"/>

    <!-- Structured Analytics Right -->
    <g transform="translate(600, 300)">
      <rect x="-80" y="-100" width="160" height="200" rx="12" fill="#f1f5f9" stroke="#14b8a6" stroke-width="3"/>
      <rect x="-50" y="-70" width="100" height="20" rx="4" fill="#06b6d4" opacity="0.2"/>
      <rect x="-50" y="-30" width="70" height="15" rx="4" fill="#14b8a6" opacity="0.6"/>
      <rect x="-50" y="5" width="100" height="15" rx="4" fill="#14b8a6" opacity="0.6"/>
      <rect x="-50" y="40" width="40" height="15" rx="4" fill="#06b6d4" opacity="0.8"/>
    </g>
  
</svg>