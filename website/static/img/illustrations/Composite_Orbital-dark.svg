<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <!-- Domain A -->
    <circle cx="280" cy="300" r="140" fill="#1e293b" stroke="#14b8a6" stroke-width="2" stroke-dasharray="12 6" opacity="0.8"/>
    <rect x="220" y="240" width="40" height="40" rx="8" fill="#14b8a6" opacity="0.2" stroke="#14b8a6" stroke-width="2"/>
    <rect x="260" y="310" width="60" height="30" rx="6" fill="#06b6d4" opacity="0.3" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="200" cy="320" r="15" fill="#14b8a6"/>
    
    <!-- Shared Event Pipeline -->
    <rect x="360" y="270" width="80" height="60" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/>
    <circle cx="400" cy="300" r="8" fill="#06b6d4"/>
    <path d="M320 300 L360 300 M440 300 L480 300" stroke="#f1f5f9" stroke-width="3" opacity="0.6"/>

    <!-- Domain B -->
    <circle cx="520" cy="300" r="140" fill="#1e293b" stroke="#06b6d4" stroke-width="2" stroke-dasharray="12 6" opacity="0.8"/>
    <polygon points="520,220 560,280 480,280" fill="#14b8a6" opacity="0.3" stroke="#14b8a6" stroke-width="2"/>
    <rect x="490" y="320" width="40" height="40" rx="4" fill="#06b6d4" opacity="0.4" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="580" cy="350" r="10" fill="#14b8a6" filter="url(#glow)"/>
  
</svg>