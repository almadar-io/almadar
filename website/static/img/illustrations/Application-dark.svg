<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <!-- Central Core -->
    <circle cx="400" cy="300" r="60" fill="none" stroke="#14b8a6" stroke-width="4" filter="url(#glow)"/>
    <circle cx="400" cy="300" r="40" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="400" cy="300" r="10" fill="#14b8a6"/>
    
    <!-- Connectors -->
    <path d="M400 240 L400 150 M348 330 L200 420 M452 330 L600 420" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="8 4" opacity="0.4"/>
    
    <!-- Pillar 1: Orb -->
    <g transform="translate(400, 100)">
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#1e293b" stroke="#14b8a6" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#06b6d4"/>
    </g>
    
    <!-- Pillar 2: Studio -->
    <g transform="translate(180, 440)">
      <rect x="-50" y="-35" width="100" height="70" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
      <line x1="-50" y1="-15" x2="50" y2="-15" stroke="#06b6d4" stroke-width="2"/>
      <rect x="-40" y="-5" width="30" height="4" rx="2" fill="#14b8a6" opacity="0.8"/>
      <rect x="-40" y="5" width="50" height="4" rx="2" fill="#14b8a6" opacity="0.6"/>
      <rect x="-40" y="15" width="20" height="4" rx="2" fill="#14b8a6" opacity="0.4"/>
    </g>
    
    <!-- Pillar 3: Services -->
    <g transform="translate(620, 440)">
      <rect x="-40" y="-30" width="80" height="15" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
      <rect x="-40" y="-5" width="80" height="15" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
      <rect x="-40" y="20" width="80" height="15" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
      <circle cx="-20" cy="-22" r="3" fill="#06b6d4" filter="url(#soft-glow)"/>
      <circle cx="-20" cy="2" r="3" fill="#06b6d4" filter="url(#soft-glow)"/>
      <circle cx="-20" cy="27" r="3" fill="#06b6d4" filter="url(#soft-glow)"/>
    </g>
    
    <!-- Dynamic Orbits -->
    <path d="M220 200 Q400 50 580 200" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
    <circle cx="300" cy="115" r="4" fill="#06b6d4" filter="url(#glow)"/>
  
</svg>