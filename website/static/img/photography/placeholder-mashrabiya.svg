<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm parchment background -->
  <rect width="800" height="600" fill="#faf8f5"/>

  <!-- Subtle paper grain texture -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
  </filter>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.03"/>

  <!-- Mashrabiya diamond grid pattern -->
  <g opacity="0.08">
    <!-- Row 1 -->
    <path d="M200 100 L240 140 L200 180 L160 140 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M300 100 L340 140 L300 180 L260 140 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M400 100 L440 140 L400 180 L360 140 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M500 100 L540 140 L500 180 L460 140 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M600 100 L640 140 L600 180 L560 140 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <!-- Row 2 -->
    <path d="M250 180 L290 220 L250 260 L210 220 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M350 180 L390 220 L350 260 L310 220 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M450 180 L490 220 L450 260 L410 220 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M550 180 L590 220 L550 260 L510 220 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <!-- Row 3 -->
    <path d="M200 260 L240 300 L200 340 L160 300 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M300 260 L340 300 L300 340 L260 300 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M400 260 L440 300 L400 340 L360 300 Z" stroke="#c9a227" stroke-width="1" fill="none"/>
    <path d="M500 260 L540 300 L500 340 L460 300 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M600 260 L640 300 L600 340 L560 300 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <!-- Row 4 -->
    <path d="M250 340 L290 380 L250 420 L210 380 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M350 340 L390 380 L350 420 L310 380 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M450 340 L490 380 L450 420 L410 380 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M550 340 L590 380 L550 420 L510 380 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <!-- Row 5 -->
    <path d="M200 420 L240 460 L200 500 L160 460 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M300 420 L340 460 L300 500 L260 460 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M400 420 L440 460 L400 500 L360 460 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M500 420 L540 460 L500 500 L460 460 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
    <path d="M600 420 L640 460 L600 500 L560 460 Z" stroke="#14b8a6" stroke-width="1" fill="none"/>
  </g>

  <!-- Central gold accent dot -->
  <circle cx="400" cy="300" r="4" fill="#c9a227" opacity="0.3"/>

  <!-- Cross lines through center -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#c9a227" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="50" x2="400" y2="550" stroke="#c9a227" stroke-width="0.5" opacity="0.1"/>
</svg>
