<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .light-variant { display: block; }
      .dark-variant { display: none; }
      @media (prefers-color-scheme: dark) {
        .light-variant { display: none; }
        .dark-variant { display: block; }
      }
    </style>
  </defs>
  <g class="light-variant">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
    <!-- Outer spiral rectangles, shrinking inward -->
    <rect x="150" y="100" width="500" height="400" rx="12" fill="#f1f5f9" stroke="#14b8a6" stroke-width="2.5" opacity="0.4"/>
    <rect x="200" y="140" width="400" height="320" rx="10" fill="#f1f5f9" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
    <rect x="250" y="180" width="300" height="240" rx="8" fill="#f1f5f9" stroke="#14b8a6" stroke-width="2" opacity="0.6"/>
    <rect x="300" y="220" width="200" height="160" rx="6" fill="#f1f5f9" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>
    <rect x="340" y="255" width="120" height="90" rx="5" fill="#f1f5f9" stroke="#14b8a6" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Code lines inside innermost box -->
    <rect x="355" y="270" width="40" height="5" rx="2" fill="#14b8a6" opacity="0.7"/>
    <rect x="355" y="280" width="60" height="5" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="355" y="290" width="50" height="5" rx="2" fill="#14b8a6" opacity="0.5"/>
    <rect x="355" y="300" width="70" height="5" rx="2" fill="#06b6d4" opacity="0.4"/>
    <!-- Arrows from inner to outer (code generating code) -->
    <path d="M460 300 C 500 300, 520 260, 550 240" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 3" opacity="0.5"/>
    <path d="M340 260 C 300 240, 270 220, 240 200" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 3" opacity="0.5"/>
    <path d="M460 330 C 520 350, 560 380, 600 400" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 3" opacity="0.4"/>
    <path d="M340 330 C 280 350, 240 380, 200 410" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 3" opacity="0.4"/>
    <!-- Code line hints on outer layers -->
    <rect x="170" y="120" width="50" height="4" rx="2" fill="rgba(20, 184, 166, 0.3)" opacity="0.3"/>
    <rect x="220" y="160" width="60" height="4" rx="2" fill="rgba(20, 184, 166, 0.3)" opacity="0.3"/>
    <rect x="270" y="200" width="40" height="4" rx="2" fill="rgba(20, 184, 166, 0.3)" opacity="0.3"/>
    <!-- Center glow -->
    <circle cx="400" cy="300" r="12" fill="#06b6d4" filter="url(#soft-glow)"/>
  
</g>
  <g class="dark-variant">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#0f172a"/>
    <!-- Outer spiral rectangles, shrinking inward -->
    <rect x="150" y="100" width="500" height="400" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="2.5" opacity="0.4"/>
    <rect x="200" y="140" width="400" height="320" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
    <rect x="250" y="180" width="300" height="240" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="2" opacity="0.6"/>
    <rect x="300" y="220" width="200" height="160" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>
    <rect x="340" y="255" width="120" height="90" rx="5" fill="#1e293b" stroke="#14b8a6" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Code lines inside innermost box -->
    <rect x="355" y="270" width="40" height="5" rx="2" fill="#14b8a6" opacity="0.7"/>
    <rect x="355" y="280" width="60" height="5" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="355" y="290" width="50" height="5" rx="2" fill="#14b8a6" opacity="0.5"/>
    <rect x="355" y="300" width="70" height="5" rx="2" fill="#06b6d4" opacity="0.4"/>
    <!-- Arrows from inner to outer (code generating code) -->
    <path d="M460 300 C 500 300, 520 260, 550 240" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 3" opacity="0.5"/>
    <path d="M340 260 C 300 240, 270 220, 240 200" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 3" opacity="0.5"/>
    <path d="M460 330 C 520 350, 560 380, 600 400" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 3" opacity="0.4"/>
    <path d="M340 330 C 280 350, 240 380, 200 410" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 3" opacity="0.4"/>
    <!-- Code line hints on outer layers -->
    <rect x="170" y="120" width="50" height="4" rx="2" fill="rgba(20, 184, 166, 0.25)" opacity="0.3"/>
    <rect x="220" y="160" width="60" height="4" rx="2" fill="rgba(20, 184, 166, 0.25)" opacity="0.3"/>
    <rect x="270" y="200" width="40" height="4" rx="2" fill="rgba(20, 184, 166, 0.25)" opacity="0.3"/>
    <!-- Center glow -->
    <circle cx="400" cy="300" r="12" fill="#06b6d4" filter="url(#soft-glow)"/>
  
</g>
</svg>