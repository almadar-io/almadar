<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
    <!-- Expanded layers (top) -->
    <rect x="200" y="80" width="400" height="40" rx="8" fill="#f1f5f9" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5" opacity="0.4"/>
    <rect x="220" y="140" width="360" height="40" rx="8" fill="#f1f5f9" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5" opacity="0.5"/>
    <rect x="240" y="200" width="320" height="40" rx="8" fill="#f1f5f9" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5" opacity="0.6"/>
    <!-- Compression arrows -->
    <path d="M400 260 L400 310" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow-06b6d4)" opacity="0.8"/>
    <polygon points="390,305 400,320 410,305" fill="#06b6d4"/>
    <!-- Compacted result (bottom) -->
    <rect x="250" y="340" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
    <rect x="265" y="355" width="80" height="8" rx="3" fill="#14b8a6" opacity="0.8"/>
    <rect x="265" y="368" width="120" height="6" rx="3" fill="#06b6d4" opacity="0.6"/>
    <!-- Side compression indicators -->
    <line x1="190" y1="100" x2="240" y2="365" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
    <line x1="610" y1="100" x2="560" y2="365" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
    <!-- Dense info bars inside expanded layers -->
    <rect x="215" y="90" width="60" height="6" rx="2" fill="#14b8a6" opacity="0.5"/>
    <rect x="290" y="90" width="100" height="6" rx="2" fill="#06b6d4" opacity="0.4"/>
    <rect x="235" y="150" width="80" height="6" rx="2" fill="#14b8a6" opacity="0.5"/>
    <rect x="330" y="150" width="50" height="6" rx="2" fill="#06b6d4" opacity="0.4"/>
    <rect x="255" y="210" width="70" height="6" rx="2" fill="#14b8a6" opacity="0.5"/>
    <rect x="340" y="210" width="90" height="6" rx="2" fill="#06b6d4" opacity="0.4"/>
    <!-- Bottom summary sparkle -->
    <circle cx="530" cy="365" r="8" fill="#06b6d4" filter="url(#soft-glow)"/>
  
</svg>