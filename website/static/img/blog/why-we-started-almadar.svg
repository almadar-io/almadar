        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#0f172a"/>
    <!-- Winding path from bottom-left to star -->
    <path d="M120 520 C 180 480, 200 440, 230 400 C 260 360, 300 340, 340 300 C 380 260, 400 230, 420 200" fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.4"/>
