<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .light-variant { display: block; }
      .dark-variant { display: none; }
      @media (prefers-color-scheme: dark) {
        .light-variant { display: none; }
        .dark-variant { display: block; }
      }
    </style>
  </defs>
  <g class="light-variant">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
    <!-- Winding path from bottom-left to star -->
    <path d="M120 520 C 180 480, 200 440, 230 400 C 260 360, 300 340, 340 300 C 380 260, 400 230, 420 200" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.4"/>
    <!-- Path dots -->
    <circle cx="120" cy="520" r="5" fill="#0f172a" opacity="0.3"/>
    <circle cx="230" cy="400" r="5" fill="#0f172a" opacity="0.35"/>
    <circle cx="340" cy="300" r="5" fill="#0f172a" opacity="0.4"/>
    <!-- North star / compass -->
    <g transform="translate(440, 160)">
      <!-- Compass circle -->
      <circle cx="0" cy="0" r="60" fill="#f1f5f9" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
      <!-- Cardinal points -->
      <polygon points="0,-50 6,-15 -6,-15" fill="#06b6d4"/>
      <polygon points="0,50 6,15 -6,15" fill="#14b8a6" opacity="0.5"/>
      <polygon points="-50,0 -15,-6 -15,6" fill="#14b8a6" opacity="0.5"/>
      <polygon points="50,0 15,-6 15,6" fill="#14b8a6" opacity="0.5"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="8" fill="#06b6d4" filter="url(#soft-glow)"/>
      <!-- Tick marks -->
      <line x1="0" y1="-56" x2="0" y2="-64" stroke="#14b8a6" stroke-width="2"/>
      <line x1="0" y1="56" x2="0" y2="64" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
      <line x1="-56" y1="0" x2="-64" y2="0" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
      <line x1="56" y1="0" x2="64" y2="0" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    </g>
    <!-- Faint radiating lines from star -->
    <line x1="440" y1="100" x2="440" y2="40" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <line x1="510" y1="130" x2="560" y2="100" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
    <line x1="370" y1="130" x2="320" y2="100" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
  
</g>
  <g class="dark-variant">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
