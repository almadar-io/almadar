<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .light-variant { display: block; }
      .dark-variant { display: none; }
      @media (prefers-color-scheme: dark) {
        .light-variant { display: none; }
        .dark-variant { display: block; }
      }
    </style>
  </defs>
  <g class="light-variant">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
    <!-- Circle A -->
    <circle cx="320" cy="300" r="160" fill="#f1f5f9" stroke="#14b8a6" stroke-width="3" opacity="0.7"/>
    <!-- Circle B -->
    <circle cx="480" cy="300" r="160" fill="#f1f5f9" stroke="#06b6d4" stroke-width="3" opacity="0.7"/>
    <!-- Shared overlap highlight -->
    <path d="M400 168 A160 160 0 0 1 400 432 A160 160 0 0 1 400 168" fill="#14b8a6" opacity="0.12"/>
    <!-- Nodes in A only -->
    <circle cx="230" cy="270" r="12" fill="#14b8a6" opacity="0.5"/>
    <circle cx="250" cy="330" r="8" fill="#14b8a6" opacity="0.4"/>
    <circle cx="210" cy="310" r="10" fill="#14b8a6" opacity="0.3"/>
    <!-- Nodes in B only -->
    <circle cx="570" cy="270" r="12" fill="#06b6d4" opacity="0.5"/>
    <circle cx="550" cy="330" r="8" fill="#06b6d4" opacity="0.4"/>
    <circle cx="590" cy="310" r="10" fill="#06b6d4" opacity="0.3"/>
    <!-- Shared center nodes -->
    <circle cx="400" cy="280" r="14" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="400" cy="320" r="10" fill="#14b8a6" filter="url(#soft-glow)"/>
    <circle cx="385" cy="300" r="8" fill="#06b6d4" opacity="0.7"/>
    <circle cx="415" cy="300" r="8" fill="#14b8a6" opacity="0.7"/>
    <!-- Connection lines in shared zone -->
    <line x1="385" y1="300" x2="400" y2="280" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    <line x1="415" y1="300" x2="400" y2="280" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
    <line x1="385" y1="300" x2="400" y2="320" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    <line x1="415" y1="300" x2="400" y2="320" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  
</g>
  <g class="dark-variant">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
