<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
    <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
    <!-- Main timeline -->
    <line x1="100" y1="300" x2="700" y2="300" stroke="#14b8a6" stroke-width="3"/>
    <!-- Timeline segments -->
    <rect x="100" y="290" width="120" height="20" rx="4" fill="#14b8a6" opacity="0.3"/>
    <rect x="260" y="290" width="80" height="20" rx="4" fill="#14b8a6" opacity="0.3"/>
    <rect x="380" y="290" width="140" height="20" rx="4" fill="#14b8a6" opacity="0.3"/>
    <rect x="560" y="290" width="140" height="20" rx="4" fill="#14b8a6" opacity="0.3"/>
    <!-- Interruption markers (vertical lines + diamonds) -->
    <line x1="220" y1="250" x2="220" y2="350" stroke="#06b6d4" stroke-width="2.5"/>
    <polygon points="220,240 230,250 220,260 210,250" fill="#06b6d4" filter="url(#soft-glow)"/>
    <line x1="340" y1="250" x2="340" y2="350" stroke="#06b6d4" stroke-width="2.5"/>
    <polygon points="340,240 350,250 340,260 330,250" fill="#06b6d4" filter="url(#soft-glow)"/>
    <line x1="520" y1="250" x2="520" y2="350" stroke="#06b6d4" stroke-width="2.5"/>
    <polygon points="520,240 530,250 520,260 510,250" fill="#06b6d4" filter="url(#soft-glow)"/>
    <!-- Learning curve above -->
    <path d="M120 200 Q 220 190, 260 170 Q 340 160, 400 140 Q 520 120, 680 100" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
    <!-- Learning increment dots -->
    <circle cx="220" cy="185" r="6" fill="#06b6d4"/>
    <circle cx="340" cy="155" r="6" fill="#06b6d4"/>
    <circle cx="520" cy="115" r="8" fill="#06b6d4" filter="url(#glow)"/>
    <!-- Labels (abstract bars) -->
    <rect x="200" y="365" width="40" height="5" rx="2" fill="#0f172a" opacity="0.3"/>
    <rect x="320" y="365" width="40" height="5" rx="2" fill="#0f172a" opacity="0.3"/>
    <rect x="500" y="365" width="40" height="5" rx="2" fill="#0f172a" opacity="0.3"/>
  
</svg>