name: Deploy Websites

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to deploy (main/orb/studio/services/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - main
          - orb
          - studio
          - services

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      main: ${{ steps.filter.outputs.main }}
      orb: ${{ steps.filter.outputs.orb }}
      studio: ${{ steps.filter.outputs.studio }}
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main:
              - 'website/shared/**'
              - 'website/sites/main/**'
            orb:
              - 'website/shared/**'
              - 'website/sites/orb/**'
            studio:
              - 'website/shared/**'
              - 'website/sites/studio/**'
            services:
              - 'website/shared/**'
              - 'website/sites/services/**'

  deploy-main:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (needs.detect-changes.outputs.main == 'true' ||
       github.event.inputs.site == 'main' ||
       github.event.inputs.site == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build main site
        working-directory: website
        run: npm run build:main
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kflow-b3a39
          target: main
          entryPoint: website

  deploy-orb:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (needs.detect-changes.outputs.orb == 'true' ||
       github.event.inputs.site == 'orb' ||
       github.event.inputs.site == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build orb site
        working-directory: website
        run: npm run build:orb
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kflow-b3a39
          target: orb
          entryPoint: website

  deploy-studio:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (needs.detect-changes.outputs.studio == 'true' ||
       github.event.inputs.site == 'studio' ||
       github.event.inputs.site == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build studio site
        working-directory: website
        run: npm run build:studio
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kflow-b3a39
          target: studio
          entryPoint: website

  deploy-services:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (needs.detect-changes.outputs.services == 'true' ||
       github.event.inputs.site == 'services' ||
       github.event.inputs.site == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build services site
        working-directory: website
        run: npm run build:services
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kflow-b3a39
          target: services
          entryPoint: website
