name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build All Sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build all sites
        working-directory: website
        run: npm run build:all
        env:
          NODE_ENV: production

      - name: Upload main build
        uses: actions/upload-artifact@v4
        with:
          name: build-main
          path: website/sites/main/build

      - name: Upload orb build
        uses: actions/upload-artifact@v4
        with:
          name: build-orb
          path: website/sites/orb/build

      - name: Upload studio build
        uses: actions/upload-artifact@v4
        with:
          name: build-studio
          path: website/sites/studio/build

      - name: Upload services build
        uses: actions/upload-artifact@v4
        with:
          name: build-services
          path: website/sites/services/build

      - name: Upload main for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/sites/main/build

  deploy-github-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: website/sites

      - name: Move builds to correct locations
        run: |
          mv website/sites/build-main website/sites/main/build
          mv website/sites/build-orb website/sites/orb/build
          mv website/sites/build-studio website/sites/studio/build
          mv website/sites/build-services website/sites/services/build

      - name: Deploy all sites to Firebase
        working-directory: website
        run: npx firebase-tools deploy --only hosting --project kflow-b3a39
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
