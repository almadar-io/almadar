name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  # Package pre-built binaries from cli/dist/
  # Binaries are built locally and synced via almadar-sync script
  package:
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            ext: ""
          - name: linux-arm64
            ext: ""
          - name: darwin-x64
            ext: ""
          - name: darwin-arm64
            ext: ""
          - name: windows-x64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Check if binary exists
        id: check
        run: |
          BINARY_PATH="cli/dist/${{ matrix.name }}/orb${{ matrix.ext }}"
          if [ -f "$BINARY_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Binary found: $BINARY_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Binary not found: $BINARY_PATH"
            echo "Available binaries:"
            ls -la cli/dist/ 2>/dev/null || echo "No dist directory"
          fi

      - name: Package binary (Unix)
        if: steps.check.outputs.exists == 'true' && matrix.ext == ''
        run: |
          mkdir -p dist
          cp "cli/dist/${{ matrix.name }}/orb" dist/orb
          chmod +x dist/orb
          # Bundle shell template alongside binary (try repo-level, fallback to platform dist)
          if [ -d "cli/shells/orb-shell" ]; then
            mkdir -p dist/shells
            cp -r cli/shells/orb-shell dist/shells/orb-shell
            rm -rf dist/shells/orb-shell/node_modules
            rm -rf dist/shells/orb-shell/.turbo
          elif [ -d "cli/dist/${{ matrix.name }}/shells/orb-shell" ]; then
            mkdir -p dist/shells
            cp -r "cli/dist/${{ matrix.name }}/shells/orb-shell" dist/shells/orb-shell
          fi
          cd dist
          TAR_ARGS="orb"
          if [ -d "shells" ]; then TAR_ARGS="$TAR_ARGS shells/"; fi
          tar -czvf "orb-${{ matrix.name }}.tar.gz" $TAR_ARGS
          rm -rf orb shells/

      - name: Package binary (Windows)
        if: steps.check.outputs.exists == 'true' && matrix.ext == '.exe'
        run: |
          mkdir -p dist
          cp "cli/dist/${{ matrix.name }}/orb.exe" dist/orb.exe
          # Bundle shell template alongside binary (try repo-level, fallback to platform dist)
          if [ -d "cli/shells/orb-shell" ]; then
            mkdir -p dist/shells
            cp -r cli/shells/orb-shell dist/shells/orb-shell
            rm -rf dist/shells/orb-shell/node_modules
            rm -rf dist/shells/orb-shell/.turbo
          elif [ -d "cli/dist/${{ matrix.name }}/shells/orb-shell" ]; then
            mkdir -p dist/shells
            cp -r "cli/dist/${{ matrix.name }}/shells/orb-shell" dist/shells/orb-shell
          fi
          cd dist
          ZIP_ARGS="orb.exe"
          if [ -d "shells" ]; then ZIP_ARGS="$ZIP_ARGS shells/"; fi
          zip -r "orb-${{ matrix.name }}.zip" $ZIP_ARGS
          rm -rf orb.exe shells/

      - name: Upload artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orb-${{ matrix.name }}
          path: dist/orb-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \; 2>/dev/null || true
          echo "Release assets:"
          ls -la release/ || echo "No release assets found"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          BODY=$(cat <<'BODY_EOF'
          ## Orb VERSION_PLACEHOLDER

          ### Installation

          #### Install Script (macOS/Linux)
          ```bash
          curl -fsSL https://orb.almadar.io/install.sh | sh
          ```

          #### Install Script (Windows PowerShell)
          ```powershell
          irm https://orb.almadar.io/install.ps1 | iex
          ```

          #### Direct Download
          Download the appropriate binary for your platform from the assets below.

          | Platform | Architecture | File |
          |----------|-------------|------|
          | Linux | x64 | `orb-linux-x64.tar.gz` |
          | Linux | ARM64 | `orb-linux-arm64.tar.gz` |
          | macOS | Intel | `orb-darwin-x64.tar.gz` |
          | macOS | Apple Silicon | `orb-darwin-arm64.tar.gz` |
          | Windows | x64 | `orb-windows-x64.zip` |

          ### Quick Start

          ```bash
          # Validate a schema
          orb validate my-app.orb

          # Compile to TypeScript
          orb compile my-app.orb --shell typescript

          # Start development server
          orb dev my-app.orb
          ```

          ### Documentation

          - [Getting Started](https://orb.almadar.io/docs/getting-started/introduction)
          - [Standard Library](https://orb.almadar.io/stdlib)
          - [Downloads](https://orb.almadar.io/downloads)
          BODY_EOF
          )

          BODY="${BODY//VERSION_PLACEHOLDER/$VERSION}"

          # Create release if it doesn't exist, update if it does
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION exists, updating assets..."
            gh release upload "$VERSION" release/* --clobber
          else
            echo "Creating release $VERSION..."
            gh release create "$VERSION" release/* \
              --title "Orb $VERSION" \
              --notes "$BODY" \
              --latest \
              --generate-notes
          fi

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare and publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ROOT_DIR="$(pwd)"

          declare -A PLATFORMS=(
            ["linux-x64"]="linux x64"
            ["linux-arm64"]="linux arm64"
            ["darwin-x64"]="darwin x64"
            ["darwin-arm64"]="darwin arm64"
            ["windows-x64"]="win32 x64"
          )

          mkdir -p npm-packages

          for platform in "${!PLATFORMS[@]}"; do
            read os cpu <<< "${PLATFORMS[$platform]}"

            ARTIFACT_DIR="${ROOT_DIR}/artifacts/orb-${platform}"
            if [ ! -d "$ARTIFACT_DIR" ]; then
              echo "Skipping $platform - no artifact directory"
              continue
            fi

            PKG_DIR="${ROOT_DIR}/npm-packages/@almadar/orb-${platform}"
            mkdir -p "$PKG_DIR"
            cd "$PKG_DIR"

            if [[ "$platform" == windows* ]]; then
              unzip "${ARTIFACT_DIR}/orb-${platform}.zip" || echo "Failed to extract $platform"
            else
              tar -xzf "${ARTIFACT_DIR}/orb-${platform}.tar.gz" || echo "Failed to extract $platform"
            fi

            cat > package.json << EOF
          {
            "name": "@almadar/orb-${platform}",
            "version": "${VERSION}",
            "description": "Orb CLI binary for ${platform}",
            "license": "MIT",
            "repository": { "type": "git", "url": "https://github.com/almadar-io/almadar.git" },
            "os": ["${os}"],
            "cpu": ["${cpu}"]
          }
          EOF

            echo "Publishing @almadar/orb-${platform}..."
            npm publish --access public || echo "Failed to publish @almadar/orb-${platform}"
            cd "$ROOT_DIR"
          done

          # Main package
          if [ -d "cli/npm" ]; then
            PKG_DIR="${ROOT_DIR}/npm-packages/@almadar/orb"
            mkdir -p "$PKG_DIR"
            cp -r cli/npm/* "$PKG_DIR/"

            # Copy shell templates (excluding node_modules, .git, generated)
            if [ -d "cli/shells" ]; then
              echo "Copying shell templates..."
              mkdir -p "$PKG_DIR/shells"
              for shell_dir in cli/shells/*/; do
                shell_name=$(basename "$shell_dir")
                echo "  Copying $shell_name..."
                mkdir -p "$PKG_DIR/shells/$shell_name"
                rsync -a --exclude='node_modules' --exclude='.git' --exclude='generated' --exclude='dist' \
                  "$shell_dir" "$PKG_DIR/shells/$shell_name/"
              done
              echo "Shell templates size: $(du -sh "$PKG_DIR/shells" | cut -f1)"
            fi

            cd "$PKG_DIR"
            jq --arg v "$VERSION" '.version = $v | .optionalDependencies |= with_entries(.value = $v)' package.json > tmp.json && mv tmp.json package.json
            echo "Publishing @almadar/orb..."
            npm publish --access public || echo "Failed to publish @almadar/orb"
          fi

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_HOMEBREW == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BASE_URL="https://github.com/almadar-io/almadar/releases/download/${VERSION}"

          for platform in darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if curl -fsSL "${BASE_URL}/orb-${platform}.tar.gz" -o "orb-${platform}.tar.gz" 2>/dev/null; then
              SHA=$(sha256sum "orb-${platform}.tar.gz" | cut -d' ' -f1)
              echo "${platform}=${SHA}" >> $GITHUB_OUTPUT
            else
              echo "${platform}=MISSING" >> $GITHUB_OUTPUT
            fi
          done

      - name: Update Homebrew formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSION_NUM=${VERSION#v}

          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/almadar-io/homebrew-tap.git tap || exit 0

          cat > tap/Formula/orb.rb << EOF
          class Orb < Formula
            desc "Compile Orbital schemas to full-stack applications"
            homepage "https://orb.almadar.io"
            version "${VERSION_NUM}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/almadar-io/almadar/releases/download/${VERSION}/orb-darwin-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin-x64 }}"
              end
              on_arm do
                url "https://github.com/almadar-io/almadar/releases/download/${VERSION}/orb-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin-arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/almadar-io/almadar/releases/download/${VERSION}/orb-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux-x64 }}"
              end
              on_arm do
                url "https://github.com/almadar-io/almadar/releases/download/${VERSION}/orb-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux-arm64 }}"
              end
            end

            def install
              bin.install "orb"
              # Install shell templates
              (lib/"orb/shells").install Dir["shells/*"] if Dir.exist?("shells")
            end

            test do
              assert_match "orb", shell_output("#{bin}/orb --help")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/orb.rb
          git diff --staged --quiet || git commit -m "Update orb to ${VERSION}"
          git push || echo "Could not push"

  sync-orb-repo:
    name: Sync Orb Repo
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger orb repo deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/almadar-io/orb/dispatches \
            -f event_type=orb-release \
            -f "client_payload[version]=${{ needs.release.outputs.version || github.ref_name }}" || echo "Could not trigger orb repo dispatch"
