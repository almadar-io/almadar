name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  # Package pre-built binaries from cli/dist/
  package:
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            ext: ""
          - name: linux-arm64
            ext: ""
          - name: darwin-x64
            ext: ""
          - name: darwin-arm64
            ext: ""
          - name: windows-x64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Check if binary exists
        id: check
        run: |
          BINARY_PATH="cli/dist/${{ matrix.name }}/almadar${{ matrix.ext }}"
          if [ -f "$BINARY_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Binary found: $BINARY_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Binary not found: $BINARY_PATH"
            echo "Available binaries:"
            ls -la cli/dist/ || echo "No dist directory"
          fi

      - name: Package binary (Unix)
        if: steps.check.outputs.exists == 'true' && matrix.ext == ''
        run: |
          mkdir -p dist
          cp "cli/dist/${{ matrix.name }}/almadar" dist/almadar
          chmod +x dist/almadar
          cd dist
          tar -czvf "almadar-${{ matrix.name }}.tar.gz" almadar
          rm almadar

      - name: Package binary (Windows)
        if: steps.check.outputs.exists == 'true' && matrix.ext == '.exe'
        run: |
          mkdir -p dist
          cp "cli/dist/${{ matrix.name }}/almadar.exe" dist/almadar.exe
          cd dist
          zip "almadar-${{ matrix.name }}.zip" almadar.exe
          rm almadar.exe

      - name: Upload artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: almadar-${{ matrix.name }}
          path: dist/almadar-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \; 2>/dev/null || true
          echo "Release assets:"
          ls -la release/ || echo "No release assets found"

      - name: Check for assets
        id: assets
        run: |
          if [ -z "$(ls -A release/ 2>/dev/null)" ]; then
            echo "has_assets=false" >> $GITHUB_OUTPUT
            echo "WARNING: No binary assets found. Release will be created without downloadable binaries."
            echo "To add binaries, run the almadar-sync script with cross-compiled binaries."
          else
            echo "has_assets=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Almadar ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
          body: |
            ## Almadar ${{ steps.version.outputs.version }}

            ### Installation

            #### Install Script (macOS/Linux)
            ```bash
            curl -fsSL https://almadar.io/install.sh | sh
            ```

            #### Install Script (Windows PowerShell)
            ```powershell
            irm https://almadar.io/install.ps1 | iex
            ```

            #### Direct Download
            Download the appropriate binary for your platform from the assets below.

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x64 | `almadar-linux-x64.tar.gz` |
            | Linux | ARM64 | `almadar-linux-arm64.tar.gz` |
            | macOS | Intel | `almadar-darwin-x64.tar.gz` |
            | macOS | Apple Silicon | `almadar-darwin-arm64.tar.gz` |
            | Windows | x64 | `almadar-windows-x64.zip` |

            ### Quick Start

            ```bash
            # Validate a schema
            almadar validate my-app.orb

            # Compile to TypeScript
            almadar compile my-app.orb --shell typescript

            # Start development server
            almadar dev my-app.orb
            ```

            ### Documentation

            - [Getting Started](https://almadar.io/docs/en/getting-started/introduction)
            - [Standard Library](https://almadar.io/stdlib.html)
            - [API Reference](https://almadar.io/docs/en/api)

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    # Only run if NPM_TOKEN is configured
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Remove 'v' prefix for npm version
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare npm packages
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Platform packages
          declare -A PLATFORMS=(
            ["linux-x64"]="linux x64"
            ["linux-arm64"]="linux arm64"
            ["darwin-x64"]="darwin x64"
            ["darwin-arm64"]="darwin arm64"
            ["windows-x64"]="win32 x64"
          )

          mkdir -p npm-packages

          for platform in "${!PLATFORMS[@]}"; do
            read os cpu <<< "${PLATFORMS[$platform]}"

            # Check if artifact exists
            ARTIFACT_DIR="artifacts/almadar-${platform}"
            if [ ! -d "$ARTIFACT_DIR" ]; then
              echo "Skipping $platform - no artifact found"
              continue
            fi

            mkdir -p "npm-packages/@almadar/cli-${platform}"
            cd "npm-packages/@almadar/cli-${platform}"

            # Extract binary
            if [[ "$platform" == windows* ]]; then
              unzip "../../${ARTIFACT_DIR}/almadar-${platform}.zip" || true
              EXT=".exe"
            else
              tar -xzf "../../${ARTIFACT_DIR}/almadar-${platform}.tar.gz" || true
              EXT=""
            fi

            # Create package.json
            cat > package.json << EOF
          {
            "name": "@almadar/cli-${platform}",
            "version": "${VERSION}",
            "description": "Almadar CLI binary for ${platform}",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/almadar-io/almadar.git"
            },
            "os": ["${os}"],
            "cpu": ["${cpu}"]
          }
          EOF

            cd ../..
          done

          # Main package (only if cli/npm exists)
          if [ -d "cli/npm" ]; then
            mkdir -p "npm-packages/@almadar/cli"
            cp -r cli/npm/* "npm-packages/@almadar/cli/"
            cd "npm-packages/@almadar/cli"

            # Update version in package.json
            if command -v jq &> /dev/null; then
              jq --arg v "$VERSION" '.version = $v | .optionalDependencies |= with_entries(.value = $v)' package.json > tmp.json
              mv tmp.json package.json
            fi

            cd ../..
          fi

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm-packages/@almadar/cli-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              npm publish --access public || echo "Failed to publish $dir"
              cd - > /dev/null
            fi
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -d "npm-packages/@almadar/cli" ]; then
            cd npm-packages/@almadar/cli
            npm publish --access public || echo "Failed to publish main package"
          fi

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    # Only run if HOMEBREW_TAP_TOKEN is configured
    if: ${{ vars.PUBLISH_HOMEBREW == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BASE_URL="https://github.com/almadar-io/almadar/releases/download/${VERSION}"

          # Download and compute SHA256 for each platform
          for platform in darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if curl -fsSL "${BASE_URL}/almadar-${platform}.tar.gz" -o "almadar-${platform}.tar.gz" 2>/dev/null; then
              SHA=$(sha256sum "almadar-${platform}.tar.gz" | cut -d' ' -f1)
              echo "${platform}=${SHA}" >> $GITHUB_OUTPUT
              echo "SHA256 for ${platform}: ${SHA}"
            else
              echo "Could not download ${platform}"
              echo "${platform}=MISSING" >> $GITHUB_OUTPUT
            fi
          done

      - name: Clone Homebrew tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/almadar-io/homebrew-tap.git tap || echo "Could not clone homebrew-tap"

      - name: Update formula
        if: ${{ hashFiles('tap/Formula') != '' }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSION_NUM=${VERSION#v}  # Remove 'v' prefix

          cat > tap/Formula/almadar.rb << 'EOF'
          # Homebrew formula for Almadar CLI
          # Auto-generated by release workflow

          class Almadar < Formula
            desc "Compile Almadar schemas to full-stack applications"
            homepage "https://almadar.io"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/almadar-io/almadar/releases/download/vVERSION_PLACEHOLDER/almadar-darwin-x64.tar.gz"
                sha256 "SHA_DARWIN_X64"
              end
              on_arm do
                url "https://github.com/almadar-io/almadar/releases/download/vVERSION_PLACEHOLDER/almadar-darwin-arm64.tar.gz"
                sha256 "SHA_DARWIN_ARM64"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/almadar-io/almadar/releases/download/vVERSION_PLACEHOLDER/almadar-linux-x64.tar.gz"
                sha256 "SHA_LINUX_X64"
              end
              on_arm do
                url "https://github.com/almadar-io/almadar/releases/download/vVERSION_PLACEHOLDER/almadar-linux-arm64.tar.gz"
                sha256 "SHA_LINUX_ARM64"
              end
            end

            def install
              bin.install "almadar"
            end

            test do
              assert_match "almadar", shell_output("#{bin}/almadar --help")
            end
          end
          EOF

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION_NUM}/g" tap/Formula/almadar.rb
          sed -i "s/SHA_DARWIN_X64/${{ steps.sha.outputs.darwin-x64 }}/g" tap/Formula/almadar.rb
          sed -i "s/SHA_DARWIN_ARM64/${{ steps.sha.outputs.darwin-arm64 }}/g" tap/Formula/almadar.rb
          sed -i "s/SHA_LINUX_X64/${{ steps.sha.outputs.linux-x64 }}/g" tap/Formula/almadar.rb
          sed -i "s/SHA_LINUX_ARM64/${{ steps.sha.outputs.linux-arm64 }}/g" tap/Formula/almadar.rb

          cat tap/Formula/almadar.rb

      - name: Commit and push
        if: ${{ hashFiles('tap/Formula') != '' }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/almadar.rb
          git diff --staged --quiet || git commit -m "Update almadar to ${{ steps.version.outputs.version }}"
          git push || echo "Could not push to homebrew-tap"
