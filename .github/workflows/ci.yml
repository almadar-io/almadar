name: CI

on:
  # CI runs on a release tag (alongside publish) or by hand, never on a branch push.
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    name: Validate .orb schemas
    runs-on: ${{ vars.ALMADAR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # One job validates every .orb schema as JSON. Replaces the three separate
      # single-step runner jobs that previously did this (ci: validate-test-schemas
      # + lint; test.yml: validate-schemas) — same coverage, ~1 runner instead of 4.
      # The website build+deploy lives in deploy-website.yml (tag-gated).
      - name: Check tests/schemas + examples are valid JSON
        run: |
          shopt -s nullglob
          fail=0
          for file in tests/schemas/*.orb examples/*.orb; do
            python3 -c "import json; json.load(open('$file'))" || { echo "::error file=$file::invalid JSON"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "All .orb schemas are valid JSON."
          exit $fail
